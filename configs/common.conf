# Phase 2 shared build policy. This file is sourced by board profiles.
PROJECT_NAME=jh7110-desktop
TARGET_ARCH=riscv64
DEBIAN_SUITE=trixie
DEBIAN_VERSION=13.6
DEBIAN_SNAPSHOT=https://snapshot.debian.org/archive/debian/20260908T202514Z/
DEBIAN_SECURITY_SNAPSHOT=https://snapshot.debian.org/archive/debian-security/20260908T202523Z/
# Default user-facing locale and timezone for China-based boards/users. Both
# locales remain generated so the desktop can be switched to English.
TIMEZONE=Asia/Shanghai
DEFAULT_LOCALE=zh_CN.UTF-8
DEFAULT_LANGUAGE=zh_CN:zh:en_US:en
SUPPORTED_LOCALES='en_US.UTF-8 zh_CN.UTF-8'
DEFAULT_USER=root
SOURCE_LOCK=sources.lock
SOURCE_ROOT=sources
OUTPUT_ROOT=build
BUILD_TYPE=${BUILD_TYPE:-release}
KERNEL_PACKAGE_VERSION=1.0.0
BOOT_FILESYSTEM=vfat
ROOT_FILESYSTEM=ext4
BOOT_SIZE_MIB=512
