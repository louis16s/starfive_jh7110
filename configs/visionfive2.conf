BOARD_ID=visionfive2
BOARD_NAME='StarFive VisionFive 2 8GB'
BOARD_VENDOR=starfive
KERNEL_SOURCE=starfive_linux_6_12
KERNEL_DEFCONFIG=starfive_visionfive2_defconfig
# Both boards are built from the same upstream U-Boot tree; the board profile
# only selects which DTB is compiled into the FIT.  The StarFive BSP U-Boot at
# the pinned commit cannot be used as a build input: its defconfig sets
# CONFIG_SPL_FIT_SOURCE="jh7110-uboot-fit-image.its", a file that exists only in
# the vendor SDK's conf/ directory and never in the U-Boot tree, so `make all`
# produces neither u-boot.itb nor spl/u-boot-spl.bin.normal.out.  Upstream
# additionally consumes OPENSBI=fw_dynamic.bin, which is what build-uboot.sh
# and build-opensbi.sh already provide.  See docs/build.md.
UBOOT_SOURCE=uboot_upstream
OPENSBI_SOURCE=starfive_opensbi
KERNEL_DTB=jh7110-starfive-visionfive-2-v1.3b.dtb
KERNEL_DTB_COMPATIBLE='starfive,visionfive-2-v1.3b'
UBOOT_DEFCONFIG=starfive_visionfive2_defconfig
UBOOT_VARIANT=visionfive2
BOOTLOADER_MEDIA=spi-nor
ROOT_DEVICE_POLICY=uuid
NVME_POLICY=required
EMMC_POLICY=capable
MARS_DTB_ALLOWED=0
