name: Build JH7110 Desktop

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board profile to build
        required: true
        default: all
        type: choice
        options:
          - all
          - visionfive2
          - mars
      build_type:
        # Naming only: it selects the artifact name and is recorded in
        # build-manifest.txt.  It does not change compiler flags - the build
        # scripts strip BUILD_TYPE from the environment they hand to make, and
        # the kernel/rootfs/image outputs are identical either way.
        description: Build profile (artifact naming only, not compiler flags)
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      publish_release:
        description: Publish a GitHub Release after a successful release build
        required: true
        # A dispatch is normally "build this branch", not "cut a release".
        # Publishing moves and uploads assets, so it has to be asked for.
        default: false
        type: boolean
  workflow_call:
    inputs:
      board:
        required: false
        default: all
        type: string
      build_type:
        required: false
        default: release
        type: string
      publish_release:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Image builds run for the better part of an hour and can publish a release, so
# runs queue instead of cancelling each other mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate build inputs
    runs-on: ubuntu-24.04
    steps:
      # workflow_dispatch constrains board to a choice list, but workflow_call
      # passes a free-form string.  An unknown board used to fall through the
      # matrix ternary to "build both boards", while every step guarded by
      # `inputs.board == matrix.board` evaluated false - the job finished green
      # having produced nothing.  Fail here instead.
      - name: Validate board and build type
        env:
          BOARD: ${{ inputs.board }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -Eeuo pipefail
          case "$BOARD" in
            all|visionfive2|mars) ;;
            *)
              echo "unsupported board: '$BOARD' (expected all, visionfive2 or mars)" >&2
              exit 1
              ;;
          esac
          case "${BUILD_TYPE:-release}" in
            release|debug) ;;
            *)
              echo "unsupported build type: '$BUILD_TYPE' (expected release or debug)" >&2
              exit 1
              ;;
          esac
          echo "building board=$BOARD build_type=${BUILD_TYPE:-release}"

  build:
    name: ${{ matrix.board }}
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.board == 'visionfive2' && '["visionfive2"]' || inputs.board == 'mars' && '["mars"]' || '["visionfive2","mars"]') }}
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache locked source checkouts
        id: sources-cache
        uses: actions/cache/restore@v5
        with:
          path: sources
          key: ${{ runner.os }}-${{ matrix.board }}-sources-${{ hashFiles('sources.lock') }}

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # The board belongs in the key: the two matrix jobs run concurrently
          # and would otherwise compute one identical key, so whichever saved
          # second lost the race and failed, and each board restored the other
          # board's compiler cache.
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ matrix.board }}-${{ inputs.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ matrix.board }}-${{ inputs.build_type }}-

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison binfmt-support build-essential ccache cifs-utils \
            debhelper debhelper-compat device-tree-compiler dosfstools dwarves \
            e2fsprogs flex gdisk debian-archive-keyring \
            initramfs-tools libelf-dev libgnutls28-dev libncurses-dev libssl-dev \
            mmdebstrap mount qemu-user-static rsync shellcheck \
            gcc-riscv64-linux-gnu python3-yaml swig u-boot-tools \
            util-linux xz-utils
          sudo update-binfmts --enable
          ccache --zero-stats
          ccache --show-config

      - name: Validate profile and lock
        run: make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" check

      # Every shell file the image ships or the build runs, named one by one:
      # a glob over the overlay would quietly skip a script whose name changes,
      # and the point of this step is that a new one cannot be forgotten.
      - name: Run shellcheck
        run: |
          shellcheck --severity=error \
            board/*/profile.conf build.sh packages/gpu/postinst packages/gpu/initramfs-hook \
            scripts/*.sh scripts/lib/*.sh \
            rootfs/overlay/usr/bin/jh7110-diagnostics \
            rootfs/overlay/usr/bin/jh7110-info \
            rootfs/overlay/usr/bin/jh7110-test-graphics \
            rootfs/overlay/usr/bin/jh7110-welcome \
            rootfs/overlay/usr/lib/jh7110/common.sh \
            rootfs/overlay/usr/libexec/jh7110-account \
            rootfs/overlay/usr/libexec/jh7110-console-setup \
            rootfs/overlay/usr/libexec/jh7110-greeter \
            rootfs/overlay/usr/libexec/jh7110-prepare \
            rootfs/overlay/usr/libexec/jh7110-set-hostname \
            rootfs/overlay/usr/local/sbin/jh7110-mirror \
            tests/*.sh

      # systemd-analyze verify is the only checker the unit files have, and it
      # reaches outside them: it resolves ExecStart against the host's
      # filesystem, where nothing this image ships exists, and so reports every
      # path as missing.  That is noise, and so is a missing dependency.  What
      # fails the step is the wording systemd uses for the unit file itself
      # being wrong - "fatal error" is what it prints when it will refuse to
      # start the unit at all.  Everything is printed either way, so the reason
      # is in the log whether the step passed or failed.
      - name: Verify the unit files
        run: |
          status=0
          for unit in rootfs/overlay/etc/systemd/system/*.service \
              rootfs/overlay/etc/systemd/system/*.socket; do
            output=$(systemd-analyze verify "$unit" 2>&1) || true
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -Eq 'fatal error|Unknown lvalue|Invalid (setting|value)|Failed to parse'; then
              echo "::error file=$unit::the unit file has a syntax error"
              status=1
            fi
          done
          exit "$status"

      - name: Fetch locked BSP sources
        run: make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" fetch

      - name: Restore locked PVR payload cache
        id: pvr-cache
        uses: actions/cache/restore@v5
        with:
          path: sources/gpu
          key: ubuntu-24.04-${{ matrix.board }}-pvr-${{ hashFiles('sources.lock') }}

      - name: Save fetched sources before compilation
        if: steps.sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sources
          key: ${{ steps.sources-cache.outputs.cache-primary-key }}

      - name: Build OpenSBI, U-Boot and kernel packages
        id: compile
        run: |
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" opensbi
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" uboot
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" kernel
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" gpu-package

      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' }}
        run: ccache --show-stats --verbose

      - name: Save locked PVR payload cache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.pvr-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: sources/gpu
          key: ubuntu-24.04-${{ matrix.board }}-pvr-${{ hashFiles('sources.lock') }}

      - name: Save compiler cache before rootfs build
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Build Debian Trixie rootfs
        run: sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" rootfs

      - name: Install kernel package and generate initrd
        run: sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" install-kernel

      - name: Stage selected board DTB
        run: |
          set -Eeuo pipefail
          case "${{ matrix.board }}" in
            visionfive2) kernel_dtb=jh7110-starfive-visionfive-2-v1.3b.dtb ;;
            mars) kernel_dtb=jh7110-milkv-mars.dtb ;;
            *) echo "unsupported board: ${{ matrix.board }}" >&2; exit 1 ;;
          esac
          release_dir="build/${{ matrix.board }}/release"
          mkdir -p "$release_dir"
          install -m 0644 \
            "build/${{ matrix.board }}/kernel/arch/riscv/boot/dts/starfive/$kernel_dtb" \
            "$release_dir/$kernel_dtb"

      - name: Assemble and package image
        run: |
          sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" image
          sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" compress
          sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" manifest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jh7110-desktop-${{ matrix.board }}-${{ env.BUILD_TYPE }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/${{ matrix.board }}/image/*.img.xz
            build/${{ matrix.board }}/image/*.img.xz.sha256
            build/${{ matrix.board }}/packages/*.deb
            build/${{ matrix.board }}/u-boot/u-boot.bin
            build/${{ matrix.board }}/u-boot/u-boot.itb
            build/${{ matrix.board }}/u-boot/u-boot.img
            build/${{ matrix.board }}/u-boot/u-boot-*.bin
            build/${{ matrix.board }}/u-boot/u-boot-*.img
            build/${{ matrix.board }}/u-boot/spl/u-boot-spl.bin
            build/${{ matrix.board }}/u-boot/spl/u-boot-spl.bin.normal.out
            build/${{ matrix.board }}/u-boot/spl/u-boot-spl.dtb
            build/${{ matrix.board }}/opensbi/platform/generic/firmware/fw_dynamic.bin
            build/${{ matrix.board }}/release/*.dtb
            build/${{ matrix.board }}/build-manifest.txt

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release && inputs.build_type == 'release' && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download VisionFive 2 artifact
        if: inputs.board == 'all' || inputs.board == 'visionfive2'
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-visionfive2-release
          path: release/visionfive2

      - name: Download Mars artifact
        if: inputs.board == 'all' || inputs.board == 'mars'
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-mars-release
          path: release/mars

      - name: Prefix release assets by board
        run: |
          set -Eeuo pipefail
          for board in visionfive2 mars; do
            root="release/$board"
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' file; do
              directory=$(dirname "$file")
              name=$(basename "$file")
              case "$name" in *.img.xz|*.img.xz.sha256) continue ;; esac
              mv "$file" "$directory/jh7110-$board-$name"
            done < <(find "$root" -type f -print0)
          done

      # The action rejects the whole release when any single pattern matches
      # nothing, and a board-specific run has no files for the other board, so
      # a fixed two-board glob list cannot use fail_on_unmatched_files.  List
      # the downloaded files by path instead: every entry exists by
      # construction, which makes the strict check a real safety net for the
      # empty-release case it is meant to catch.
      - name: Determine release assets
        id: patterns
        env:
          BOARD: ${{ inputs.board }}
        run: |
          set -Eeuo pipefail
          case "$BOARD" in
            all) boards=(visionfive2 mars) ;;
            visionfive2|mars) boards=("$BOARD") ;;
            *)
              echo "unsupported board: '$BOARD'" >&2
              exit 1
              ;;
          esac
          files=()
          for board in "${boards[@]}"; do
            [[ -d "release/$board" ]] || continue
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < <(find "release/$board" -type f -print0 | sort -z)
          done
          (( ${#files[@]} )) || {
            echo "no release assets were downloaded for board $BOARD" >&2
            exit 1
          }
          {
            echo 'files<<RELEASE_ASSETS'
            printf '%s\n' "${files[@]}"
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Publish automatic GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: jh7110-build-${{ github.run_id }}
          name: JH7110 Desktop build ${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.patterns.outputs.files }}
