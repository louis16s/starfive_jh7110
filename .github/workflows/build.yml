name: Build JH7110 Desktop

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board profile to build
        required: true
        default: all
        type: choice
        options:
          - all
          - visionfive2
          - mars
      build_type:
        description: Build profile
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      publish_release:
        description: Publish a GitHub Release after a successful release build
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      board:
        required: false
        default: all
        type: string
      build_type:
        required: false
        default: release
        type: string
      publish_release:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.board == 'visionfive2' && '["visionfive2"]' || inputs.board == 'mars' && '["mars"]' || '["visionfive2","mars"]') }}
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'release' }}
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache locked source checkouts
        id: sources-cache
        uses: actions/cache/restore@v5
        with:
          path: sources
          key: ${{ runner.os }}-${{ matrix.board }}-sources-${{ hashFiles('sources.lock') }}

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ inputs.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-ccache-v1-${{ inputs.build_type }}-

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison binfmt-support build-essential ccache cifs-utils \
            debhelper debhelper-compat device-tree-compiler dosfstools dwarves flex gdisk \
            debian-archive-keyring \
            initramfs-tools libelf-dev libgnutls28-dev libncurses-dev libssl-dev \
            mmdebstrap mount qemu-user-static rsync shellcheck \
            gcc-riscv64-linux-gnu python3-yaml swig u-boot-tools \
            util-linux xz-utils
          sudo update-binfmts --enable
          ccache --zero-stats
          ccache --show-config

      - name: Validate profile and lock
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" check

      - name: Run shellcheck
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: shellcheck --severity=error scripts/*.sh build.sh board/*/profile.conf rootfs/overlay/usr/libexec/jh7110-firstboot rootfs/overlay/usr/bin/jh7110-test-graphics rootfs/overlay/usr/local/sbin/jh7110-mirror

      - name: Fetch locked BSP sources
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" fetch

      - name: Restore locked PVR payload cache
        id: pvr-cache
        uses: actions/cache/restore@v5
        with:
          path: sources/gpu
          key: ubuntu-24.04-${{ matrix.board }}-pvr-${{ hashFiles('sources.lock') }}

      - name: Save fetched sources before compilation
        if: steps.sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sources
          key: ${{ steps.sources-cache.outputs.cache-primary-key }}

      - name: Build OpenSBI, U-Boot and kernel packages
        id: compile
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: |
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" opensbi
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" uboot
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" kernel
          make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" gpu-package

      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' }}
        run: ccache --show-stats --verbose

      - name: Save locked PVR payload cache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.pvr-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: sources/gpu
          key: ubuntu-24.04-${{ matrix.board }}-pvr-${{ hashFiles('sources.lock') }}

      - name: Save compiler cache before rootfs build
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Build Debian Trixie rootfs
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" rootfs

      - name: Install kernel package and generate initrd
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" install-kernel

      - name: Stage selected board DTB
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: |
          set -Eeuo pipefail
          case "${{ matrix.board }}" in
            visionfive2) kernel_dtb=jh7110-starfive-visionfive-2-v1.3b.dtb ;;
            mars) kernel_dtb=jh7110-milkv-mars.dtb ;;
            *) echo "unsupported board: ${{ matrix.board }}" >&2; exit 1 ;;
          esac
          release_dir="build/${{ matrix.board }}/release"
          mkdir -p "$release_dir"
          install -m 0644 \
            "build/${{ matrix.board }}/kernel/arch/riscv/boot/dts/starfive/$kernel_dtb" \
            "$release_dir/$kernel_dtb"

      - name: Assemble and package image
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        run: |
          sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" image
          sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" compress
          sudo make BOARD=${{ matrix.board }} BUILD_TYPE="${BUILD_TYPE}" manifest

      - name: Upload build artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.board == 'all' || inputs.board == matrix.board
        uses: actions/upload-artifact@v6
        with:
          name: jh7110-desktop-${{ matrix.board }}-${{ env.BUILD_TYPE }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/${{ matrix.board }}/image/*.img.xz
            build/${{ matrix.board }}/image/*.img.xz.sha256
            build/${{ matrix.board }}/packages/*.deb
            build/${{ matrix.board }}/u-boot/u-boot.bin
            build/${{ matrix.board }}/u-boot/u-boot.img
            build/${{ matrix.board }}/u-boot/u-boot-*.bin
            build/${{ matrix.board }}/u-boot/u-boot-*.img
            build/${{ matrix.board }}/u-boot/spl/u-boot-spl.bin
            build/${{ matrix.board }}/u-boot/spl/u-boot-spl.bin.normal.out
            build/${{ matrix.board }}/u-boot/spl/u-boot-spl.dtb
            build/${{ matrix.board }}/opensbi/platform/generic/firmware/fw_dynamic.bin
            build/${{ matrix.board }}/release/*.dtb
            build/${{ matrix.board }}/build-manifest.txt

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release && inputs.build_type == 'release' && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download VisionFive 2 artifact
        if: inputs.board == 'all' || inputs.board == 'visionfive2'
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-visionfive2-release
          path: release/visionfive2

      - name: Download Mars artifact
        if: inputs.board == 'all' || inputs.board == 'mars'
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-mars-release
          path: release/mars

      - name: Prefix release assets by board
        run: |
          set -Eeuo pipefail
          for board in visionfive2 mars; do
            root="release/$board"
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' file; do
              directory=$(dirname "$file")
              name=$(basename "$file")
              case "$name" in *.img.xz|*.img.xz.sha256) continue ;; esac
              mv "$file" "$directory/jh7110-$board-$name"
            done < <(find "$root" -type f -print0)
          done

      - name: Publish automatic GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: jh7110-build-${{ github.run_id }}
          name: JH7110 Desktop build ${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          files: |
            release/visionfive2/**/*.img.xz
            release/visionfive2/**/*.sha256
            release/visionfive2/**/*.deb
            release/visionfive2/**/*.bin
            release/visionfive2/**/*.img
            release/visionfive2/**/*.dtb
            release/visionfive2/**/*build-manifest.txt
            release/mars/**/*.img.xz
            release/mars/**/*.sha256
            release/mars/**/*.deb
            release/mars/**/*.bin
            release/mars/**/*.img
            release/mars/**/*.dtb
            release/mars/**/*build-manifest.txt
