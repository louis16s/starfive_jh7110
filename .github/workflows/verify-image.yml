name: Verify rootfs using existing binaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap debian-archive-keyring qemu-user-static binfmt-support rsync python3-yaml dosfstools gdisk initramfs-tools device-tree-compiler
          sudo update-binfmts --enable
      - name: Test filesystem merging and release checksums
        run: |
          bash tests/test-kernel-merge.sh
          python3 tests/test-release-assets.py
      - name: Verify GPU packaging, initrd and image assembly without kernel compilation
        run: |
          set -Eeuo pipefail
          mkdir -p build/verification-logs
          sudo bash tests/verify-existing-image.sh 2>&1 | tee build/verification-logs/result.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rootfs-verification-logs
          if-no-files-found: ignore
          path: build/verification-logs
