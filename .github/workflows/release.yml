name: Release JH7110 Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      board: all
      build_type: release

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download VisionFive 2 artifacts
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-visionfive2-release
          path: release/visionfive2

      - name: Download Mars artifacts
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-mars-release
          path: release/mars

      - name: Prefix release assets by board
        run: |
          set -Eeuo pipefail
          for board in visionfive2 mars; do
            root="release/$board"
            while IFS= read -r -d '' file; do
              directory=$(dirname "$file")
              name=$(basename "$file")
              case "$name" in *.img.xz|*.img.xz.sha256) continue ;; esac
              mv "$file" "$directory/jh7110-$board-$name"
            done < <(find "$root" -type f -print0)
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/visionfive2/**/*.img.xz
            release/visionfive2/**/*.sha256
            release/visionfive2/**/*.deb
            release/visionfive2/**/*.bin
            release/visionfive2/**/*.itb
            release/visionfive2/**/*.normal.out
            release/visionfive2/**/*.img
            release/visionfive2/**/*.dtb
            release/visionfive2/**/*build-manifest.txt
            release/mars/**/*.img.xz
            release/mars/**/*.sha256
            release/mars/**/*.deb
            release/mars/**/*.bin
            release/mars/**/*.itb
            release/mars/**/*.normal.out
            release/mars/**/*.img
            release/mars/**/*.dtb
            release/mars/**/*build-manifest.txt
