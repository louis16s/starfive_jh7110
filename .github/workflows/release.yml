name: Release JH7110 Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      board: all
      build_type: release

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download VisionFive 2 artifacts
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-visionfive2-release
          path: release/visionfive2

      - name: Download Mars artifacts
        uses: actions/download-artifact@v7
        with:
          name: jh7110-desktop-mars-release
          path: release/mars

      - name: Prefix release assets by board
        run: |
          set -Eeuo pipefail
          for board in visionfive2 mars; do
            root="release/$board"
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' file; do
              directory=$(dirname "$file")
              name=$(basename "$file")
              case "$name" in *.img.xz|*.img.xz.sha256) continue ;; esac
              mv "$file" "$directory/jh7110-$board-$name"
            done < <(find "$root" -type f -print0)
          done

      # List the downloaded files by path rather than by extension globs: the
      # glob list is only as correct as a guess about what the build emits (for
      # example nothing ever produces a raw .img here, only .img.xz), while an
      # enumerated list makes fail_on_unmatched_files a real check on whether
      # anything at all was staged.
      - name: Determine release assets
        id: patterns
        run: |
          set -Eeuo pipefail
          files=()
          for board in visionfive2 mars; do
            [[ -d "release/$board" ]] || continue
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < <(find "release/$board" -type f -print0 | sort -z)
          done
          (( ${#files[@]} )) || {
            echo "no release assets were downloaded" >&2
            exit 1
          }
          {
            echo 'files<<RELEASE_ASSETS'
            printf '%s\n' "${files[@]}"
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.patterns.outputs.files }}
