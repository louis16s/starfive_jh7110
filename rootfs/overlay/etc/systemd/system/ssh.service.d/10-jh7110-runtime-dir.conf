# sshd is started with a privilege separation directory under /run, and it
# refuses to start when that directory is not there: "Missing privilege
# separation directory: /run/sshd".  /run is a tmpfs that comes up empty on
# every boot, so the directory has to be created by whoever starts the daemon.
# The image cannot rely on the package's own unit doing it - whether it does is
# a property of the openssh-server version the snapshot happens to hold, and the
# snapshot moves.  A drop-in states it here and keeps stating it across an
# upgrade, which replaces the unit but never this file.
[Service]
RuntimeDirectory=sshd
RuntimeDirectoryMode=0755
