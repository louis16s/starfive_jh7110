# How sshd is started here, in two parts.
#
# The daemon is ordered after the unit that gives the board its identity.  sshd
# does not start at all without host keys, and this image ships none - they are
# made on the board, once, by jh7110-prepare.service - so both units are wanted
# by multi-user.target and, without an ordering, they start together.  sshd
# reaching its own start-up check first exits with "no hostkeys available", and
# a unit that exited that way is not restarted: on the board's first boot the
# daemon would be dead before the run that creates the keys had finished, and
# the board would stay unreachable until someone rebooted it.  On every boot
# after the first, the condition on that unit skips it, and waiting on a unit
# that was skipped costs nothing.
#
# The daemon is also given a privilege separation directory under /run, and it
# refuses to start when that directory is not there: "Missing privilege
# separation directory: /run/sshd".  /run is a tmpfs that comes up empty on
# every boot, so the directory has to be created by whoever starts the daemon.
# The image cannot rely on the package's own unit doing it - whether it does is
# a property of the openssh-server version the snapshot happens to hold, and the
# snapshot moves.  A drop-in states it here and keeps stating it across an
# upgrade, which replaces the unit but never this file.
[Unit]
After=jh7110-prepare.service

[Service]
RuntimeDirectory=sshd
RuntimeDirectoryMode=0755
