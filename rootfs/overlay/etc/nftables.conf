#!/usr/sbin/nft -f

# Safe default policy for a development board image. Services can add
# restrictive rules later without depending on an empty or missing config.
#
# The family is `ip` and not `inet`: the kernel the board ships with has
# CONFIG_NF_TABLES_IPV4 set and CONFIG_NF_TABLES_INET unset, so an `inet` table
# is rejected at load time with "Could not process rule: Operation not
# supported" and nftables.service fails on every boot.  IPv6 is not covered
# here for the same reason - that kernel has CONFIG_NF_TABLES_IPV6 unset too -
# and a build-time `nft -c -f` cannot see any of it, because a syntax check
# never asks the kernel which families it has.
flush ruleset

table ip filter {
    chain input {
        type filter hook input priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
