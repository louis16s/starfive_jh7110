# Root never logs in over the network.  The desktop account uses sudo, and an
# unlocked root account reachable over ssh is the shortest path from a leaked
# password to a lost board.  Setting a root password (first-run setup, advanced
# options) is for the serial console and for recovery, not for sshd.
#
# The lines below are written down instead of left to the package's defaults,
# because the board this image runs on usually has no monitor: ssh is the way
# in, and a default that changes between releases would be a machine that is
# reachable until it is upgraded and unreachable afterwards.  Password
# authentication is what the account the first-run setup creates logs in with -
# the account, not root: the line above and the locked root account are both
# between root and this door.  Keyboard-interactive is the same PAM stack under
# another name, and sshd refuses it by default on Debian, so an account whose
# password is only ever checked through PAM needs both lines.
#
# This is a drop-in rather than an edit of /etc/ssh/sshd_config: Debian puts the
# `Include` for this directory at the top of that file, so what is here is read
# first and wins, and an upgrade that replaces the main file - or a person who
# edits it - does not take any of this with it.
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
X11Forwarding yes
PrintMotd no

# No AllowUsers, DenyUsers or AllowGroups on purpose.  With them absent sshd
# accepts every account that is neither root nor locked - the desktop account
# the setup creates, uid 1000 and up - and that set is what the image has:
# root is locked at build time, sshd never created a second account, and the
# wizard is what creates the first one.
