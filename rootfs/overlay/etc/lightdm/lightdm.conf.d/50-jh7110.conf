[Seat:*]
user-session=xfce
greeter-session=lightdm-gtk-greeter
# The board has exactly one human account - the one the first-run setup
# creates - and the greeter lists it.
greeter-hide-users=false
# Manual login stays off on purpose: the only name it would accept that is not
# in the list is root, and root is not a desktop login.  It is locked in the
# image, unlocked only for recovery over the console, and never reachable from
# the greeter or from sshd.
greeter-show-manual-login=false
allow-guest=false
